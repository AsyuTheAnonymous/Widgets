<style>
  .sba-wrap {
    --sba-cyan: #00f0ff;
    --sba-purple: #a855f7;
    --sba-text: #e8f6ff;
    --sba-muted: #9fb3c8;
    --sba-pos: 50%;
    font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    color: var(--sba-text);
    max-width: 980px;
    margin: 0 auto;
    padding: 8px 16px;
    box-sizing: border-box;
  }
  .sba-wrap *, .sba-wrap *::before, .sba-wrap *::after { box-sizing: border-box; }

  .sba-frame {
    position: relative;
    aspect-ratio: 16 / 10;
    max-width: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(0, 240, 255, 0.3);
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.12), 0 20px 50px rgba(0, 0, 0, 0.5);
    user-select: none;
    touch-action: pan-y;
  }
  .sba-layer { position: absolute; inset: 0; }
  .sba-layer > img, .sba-layer > svg { display: block; width: 100%; height: 100%; object-fit: cover; }
  .sba-before { clip-path: inset(0 calc(100% - var(--sba-pos)) 0 0); }

  .sba-tag {
    position: absolute;
    top: 14px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    pointer-events: none;
  }
  .sba-tag-before { left: 14px; color: #fff; background: rgba(0, 0, 0, 0.55); }
  .sba-tag-after { right: 14px; color: #000; background: linear-gradient(90deg, var(--sba-cyan), var(--sba-purple)); }

  .sba-handle {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--sba-pos);
    width: 2px;
    transform: translateX(-1px);
    background: linear-gradient(var(--sba-cyan), var(--sba-purple));
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.8);
    pointer-events: none;
  }
  .sba-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 46px;
    height: 46px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(5, 8, 14, 0.75);
    border: 2px solid var(--sba-cyan);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.55);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--sba-cyan);
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: -2px;
  }

  .sba-range {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: ew-resize;
    -webkit-appearance: none;
    appearance: none;
  }
  .sba-range:focus-visible + .sba-handle .sba-knob { outline: 3px solid var(--sba-text); outline-offset: 3px; }

  .sba-caption {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 20px;
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--sba-muted);
  }
  .sba-caption strong { color: var(--sba-text); }


  @media (max-width: 480px) {
    .sba-knob { width: 38px; height: 38px; }
    .sba-tag { top: 10px; font-size: 0.65rem; }
  }
</style>

<script>
(function () {
  var root = document.currentScript ? document.currentScript.previousElementSibling : document.querySelector('.sba-wrap');
  var range = root.querySelector('.sba-range');
  function update() { root.style.setProperty('--sba-pos', range.value + '%'); }
  range.addEventListener('input', update);
  update();
})();
</script>
